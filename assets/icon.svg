<!-- lawless-waf C: a steel shield wearing a tilted outlaw hat, filter funnel on its face. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="lawless-waf: shield in an outlaw hat with a filter funnel">
  <title>lawless-waf</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".45" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1a0202" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <g filter="url(#drop)">
    <path d="M112 196 C176 192 220 182 256 166 C292 182 336 192 400 196 L400 284 C400 370 340 424 256 462 C172 424 112 370 112 284 Z" fill="url(#steel)"/>
  </g>
  <path d="M136 214 C188 210 226 202 256 190 C286 202 324 210 376 214 L376 286 C376 358 326 404 256 436 C186 404 136 358 136 286 Z" fill="none" stroke="#64748B" stroke-opacity=".5" stroke-width="3"/>
  <path d="M194 276 L318 276 L276 328 L276 370 L238 390 L238 328 Z" fill="#1E293B" stroke="#1E293B" stroke-width="12" stroke-linejoin="round"/>

  <g transform="rotate(-9 256 190)" filter="url(#drop)">
    <path d="M172 196 C170 130 190 70 222 64 C240 61 244 84 256 84 C268 84 272 61 290 64 C322 70 342 130 340 196 Z" fill="url(#hat)"/>
    <path d="M176 164 L336 164 L338 190 L174 190 Z" fill="#94A3B8"/>
    <path d="M66 134 C96 190 186 210 256 208 C326 210 416 190 446 134 C448 206 364 244 256 244 C148 244 64 206 66 134 Z" fill="url(#brim)"/>
    <path d="M72 146 C108 196 190 214 256 212 C322 214 404 196 440 146" fill="none" stroke="#94A3B8" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 120 C204 98 214 82 226 78" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="5" stroke-linecap="round"/>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
